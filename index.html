<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Escap1ng 的个人博客：记录技术思考、设计实践与生活片段。首页是一段随滚动加速的星轨长曝光，文章按时间排在这里。" />
    <meta name="theme-color" content="#020204" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)" />

    <!-- 域名写死在这里，且与 src/data/site.js 的 url 必须是同一个源头（tests/content-rolls.test.mjs
         对拍这一枚 canonical 与 og:url/og:image）。下面这几枚是站点级的通用值：构建期会为
         每一卷文章、每一个项目与每条导航各写一份这份 HTML 的副本，并把 title / canonical /
         og:* / twitter:* 换成那一页自己的值（scripts/lib/shell.mjs）——所以直接访问
         /blog/<slug> 拿到的是 200 与本篇的分享卡，而不是回退到站点首页那一张。
         换域名时改 site.js 的 url 与这里的四处地址，两边一起改。 -->
    <link rel="canonical" href="https://escaping.top/" />
    <link rel="alternate" type="application/rss+xml" href="/rss.xml" title="Escaping Notes" />
    <meta property="og:site_name" content="Escaping Notes" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="Escaping Notes · 逃逸笔记" />
    <meta property="og:description" content="掷墨入渊，星惊不复；藏光于页，潮退犹闻。" />
    <meta property="og:url" content="https://escaping.top/" />
    <meta property="og:image" content="https://escaping.top/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="深色底片上的同心星轨长曝光" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Escaping Notes · 逃逸笔记" />
    <meta name="twitter:description" content="掷墨入渊，星惊不复；藏光于页，潮退犹闻。" />
    <meta name="twitter:image" content="https://escaping.top/og.png" />
    <title>Escaping Notes · 逃逸笔记</title>
    <script>
      // 首帧前应用主题，避免切换后闪一下。已存偏好优先；**首次访问默认亮色**（out），
      // 不再读 prefers-color-scheme——首屏现在是一张亮底照片，跟着系统翻到深色会让它变成
      // 一张压在黑底上的暗图，观感与配色都不成立。想要系统跟随，得先让首屏照片也分两版。
      // 这段逻辑是主题默认值的唯一来源，theme.js 直接读已写入的 data-theme，勿在此之外重复实现
      //（它只在属性压根没写上的异常路径补 'out'，不写存储）。这条口径由 tests/theme-default.test.mjs 钉住。
      const stored = localStorage.getItem('en-theme')
      document.documentElement.dataset.theme = stored === 'well' || stored === 'out' ? stored : 'out'

      // 首屏那张地景是本页的 LCP 元素，但它的 URL 只写在 CSS 里（site.css 两主题各自的 --hero-img），
      // 浏览器必须等 index.css 下载完并解析到那条规则，才知道要去下这张图——HTML→CSS→图片两跳瀑布，
      // 亮色那张 1.5MB 的下载要排在 32KB CSS 之后才开始。这里按刚定下的主题把它 preload 出去，
      // 让它和 CSS 并行起跑。
      // 两档必须与 site.css 的 --hero-img 逐字同值：预加载错那一张不是"没效果"，是白下 1.5MB、
      // 首屏更慢，而且静默无日志。这条对拍由 tests/hero-preload.test.mjs 从 site.css 解析出来钉住。
      // 刻意不给另一张加 preload：深色访客会把亮色那张也下下来。
      // 窄屏换 1800px 重采样版（同取景；site.css §3a 的 @media 用同一个断点与图名）：
      // 手机上是 1.45MB → 0.09MB，桌面原图不动。首帧另有 36px 宽的 LQIP data URI
      // 垫在 .hero-plate 底下（见 site.css 的 --hero-lqip），真图到了自然盖住。
      // 只有首页有这块地景（--hero-img 的唯一消费方是 HorizonHero）：次级页与 404 的壳
      // 与首页共用这段脚本，不判路径就会让每篇正文白下 0.65–1.5MB。
      if (location.pathname === '/') {
        const HERO_IMG = { out: '/plates/plate-hero.jpg', well: '/plates/plate-hero-deep.jpg' }
        const HERO_IMG_SM = { out: '/plates/plate-hero-sm.jpg', well: '/plates/plate-hero-deep-sm.jpg' }
        const narrow = matchMedia('(max-width: 720px)').matches
        const table = narrow ? HERO_IMG_SM : HERO_IMG
        const heroTheme = document.documentElement.dataset.theme
        const heroPre = document.createElement('link')
        heroPre.rel = 'preload'
        heroPre.as = 'image'
        heroPre.href = table[heroTheme] || table.out
        heroPre.setAttribute('fetchpriority', 'high')
        document.head.appendChild(heroPre)
        // 手机首页：照片没到之前，正文的展示衬线（CJK 分片 147KB）先别取——把下行让给 LCP。
        // 见 site.css §3a 的 html.hero-pending；App.vue 在 whenHeroReady() 之后摘掉这个类。
        if (narrow) document.documentElement.classList?.add('hero-pending')
      }

      // 底片模糊（0–12px）必须在首帧前落好，否则进页会先是一种糊度、store 挂上后再跳成另一种。
      // **没存过 = 12（拉满）**，这是作者的默认口味；存过 0 就真的不挂 filter
      // （App.vue 用 html[data-plate-blur] 门控，缺这个属性等于零开销）。
      // 键名与 src/lib/storage.js 的 KEYS.blur 同口径；0–12 与默认值与 lib/plate.js 的
      // BLUR_MIN/MAX/DEFAULT 同口径，由 tests/plate-blur.test.mjs 钉住。手改过的 999 要夹住，
      // 否则直接变成 blur(999px)。
      const storedBlur = parseInt(localStorage.getItem('en-plate-blur'), 10)
      const blur = Number.isFinite(storedBlur) ? Math.min(12, Math.max(0, storedBlur)) : 12
      if (blur > 0) {
        document.documentElement.style.setProperty('--plate-blur', blur + 'px')
        document.documentElement.dataset.plateBlur = String(blur)
      }

      // 卡面档位（'solid' 不透底 = 默认 / 'glass' 半透）。默认档是 CSS 自己算出来的样子，
      // 所以这里**只在偏离默认时写属性**——选过半透的访客要是不在首帧写上属性，进页就会先看到一排
      // 纯白卡再集体变半透，跟底片模糊那类闪法同一条路。没存过时什么都不写。
      // 键名与 src/lib/storage.js 的 KEYS.cardSurface 同口径，档位值与 lib/surface.js 同口径，
      // 由 tests/card-surface.test.mjs 钉住。
      if (localStorage.getItem('en-card-surface') === 'glass') {
        document.documentElement.dataset.cardSurface = 'glass'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
