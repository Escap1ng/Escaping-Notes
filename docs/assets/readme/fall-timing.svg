<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" role="img" aria-label="Timing of the fall transition: the 0.56s enter and the 0.38s leave run in parallel and overlap for 380ms">
  <defs>
    <linearGradient id="in" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ec9ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8ec9ff" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1ea" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #f4f1ea; }
      .t { font-size: 13px; }
      .s { font-size: 11px; fill: #8f8c96; }
      .h { font-size: 14px; fill: #8ec9ff; }
      .tick { stroke: #f4f1ea; stroke-opacity: .12; }
    </style>
  </defs>

  <rect width="920" height="320" fill="#0a0a10"/>
  <text class="h" x="60" y="30">the fall transition — enter / leave overlap</text>
  <text class="s" x="60" y="48">site.css §8 &lt;Transition name="fall" mode="none"&gt; · 1px ≈ 0.75ms</text>

  <!-- 轴 -->
  <path d="M60 250 H860" stroke="#f4f1ea" stroke-opacity=".25"/>
  <g class="tick">
    <path d="M60 250 V256 M193 250 V256 M327 250 V256 M460 250 V256 M593 250 V256 M727 250 V256 M860 250 V256"/>
  </g>
  <text class="s" x="52" y="272">0</text>
  <text class="s" x="178" y="272">100ms</text>
  <text class="s" x="312" y="272">200</text>
  <text class="s" x="445" y="272">300</text>
  <text class="s" x="578" y="272">400</text>
  <text class="s" x="712" y="272">500</text>
  <text class="s" x="838" y="272">600</text>

  <!-- 重叠窗口 -->
  <rect x="60" y="66" width="507" height="184" fill="#ff5c39" fill-opacity=".07" stroke="#ff5c39" stroke-opacity=".35" stroke-dasharray="4 4"/>
  <text class="s" x="240" y="243" fill="#ff5c39">380ms: both pages alive</text>

  <!-- enter -->
  <rect x="60" y="78" width="747" height="30" fill="url(#in)"/>
  <text class="t" x="72" y="98">enter 0.56s · opacity 0→1 · scale 0.94→1 · blur 10px→0</text>
  <text class="s" x="600" y="98">bezier(.22,.61,.24,1)</text>

  <!-- leave -->
  <rect x="60" y="122" width="507" height="30" fill="url(#out)"/>
  <text class="t" x="72" y="142">leave 0.38s · opacity 1→0 · scale→0.965 · blur→8px</text>
  <text class="s" x="535" y="142">bezier(.4,.05,.7,.25)</text>

  <!-- 结论 -->
  <text class="s" x="60" y="298">the plate is one per site (src/lib/sky.js): during those 380ms both cameras show the same plate, still being exposed —</text>
  <text class="s" x="60" y="313">deposition is locked (claimPlate), redraw is not — freezing the handing-over camera mid-frame WAS the stutter.</text>
</svg>
